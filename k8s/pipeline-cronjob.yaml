# k8s/pipeline-cronjob.yaml
# Scheduled runner for the detection + correlation pipeline.
# Idempotent: detections use ON CONFLICT (detection_id) DO NOTHING, incidents
# are upserted with monotone severity. Overlapping runs are prevented by
# concurrencyPolicy: Forbid; failed runs retry up to backoffLimit.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: honeytrace-pipeline
  namespace: honeytrace
spec:
  # Every 15 minutes. Adjust to the desired detection latency.
  schedule: "*/15 * * * *"
  timeZone: "UTC"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: honeytrace-pipeline
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            fsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: pipeline
              image: honeytrace-app:0.5.2
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: honeytrace-pg-secret
                      key: PIPELINE_DATABASE_URL
              command: ["python", "-m", "src.pipeline"]
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 512Mi
