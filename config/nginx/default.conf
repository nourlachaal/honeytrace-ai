log_format honeytrace escape=json
  '{"timestamp":"$time_iso8601","event_type":"juice_shop.http_request","http_method":"$request_method","route":"$uri","status_code":$status,"src_ip":"$remote_addr"}';

access_log /var/log/nginx/access.jsonl honeytrace;

server {
    listen 3000;

    location / {
        proxy_pass http://honeytrace-juice-shop:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
